services:
  - type: web
    name: cricket-auction-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma db push && npx ts-node prisma/seed.ts && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
